<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>아파트온 · 그레이지 올리브</title>
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <button class="round icon" id="menuButton" aria-label="전체 메뉴"><i class="fi fi-rr-menu-burger"></i></button>
      <button class="home-selector">
        <span class="home-logo">아</span>
        <span><b>아파트온</b><small>101동 1302호</small></span>
        <i>⌄</i>
      </button>
      <div class="header-actions">
        <div class="smart-jelly-assist" id="chatAssist" tabindex="-1">
          <div class="jelly-core" aria-hidden="true"><span class="jelly-dot"></span></div>
          <div class="input-wrap">
            <input class="home-input" id="chatInput" type="text" placeholder="궁금한 걸 입력해보세요">
          </div>
        </div>
        <button class="round icon alarm" id="alarmButton" aria-label="알림"><i class="fi fi-rr-bell"></i></button>
      </div>
    </header>

    <div class="desktop-layout">
      <aside class="desktop-menu hover-scroll-panel" id="desktopMenu"></aside>
      <div class="center-panel">
        <main id="app" class="hover-scroll-panel" aria-live="polite"></main>
        <button class="scroll-top-hint hidden" id="scrollTopHint" aria-label="맨 위로 이동"><span>⌃</span></button>
        <button class="scroll-hint" id="scrollHint" aria-label="다음 내용으로 이동"><span>⌄</span></button>
      </div>
      <aside class="desktop-alerts hover-scroll-panel">
        <div class="alert-title">
          <div><small>NOTIFICATIONS</small><h2>알림 내역</h2></div>
          <span>3</span>
        </div>
        <div class="alert-list">
          <button data-route="notice"><i class="alert-dot urgent"></i><span><b>단수 예정 안내</b><small>오늘 18:00부터 2시간 · 10분 전</small></span></button>
          <button data-route="reservation"><i class="alert-dot"></i><span><b>독서실 예약 확정</b><small>오늘 19:00 · 1시간 전</small></span></button>
          <button data-route="complaint"><i class="alert-dot done"></i><span><b>민원 답변이 등록됐어요</b><small>엘리베이터 소음 문의 · 3시간 전</small></span></button>
        </div>
        <div class="today-card">
          <small>오늘의 우리 집</small>
          <strong>모든 상태가<br>안전해요</strong>
          <div><span>실내 온도</span><b>25℃</b></div>
          <div><span>주차 위치</span><b>B2 · B-24</b></div>
        </div>
      </aside>
    </div>

    <nav class="bottom-nav" aria-label="주요 메뉴">
      <button class="nav-item active" data-route="home"><span><i class="fi fi-rr-home"></i></span>홈</button>
      <button class="nav-item" data-route="life"><span><i class="fi fi-rr-apps"></i></span>생활</button>
      <button class="nav-item center" data-route="control"><span><i class="fi fi-rr-settings-sliders"></i></span>제어</button>
      <button class="nav-item" data-route="community"><span><i class="fi fi-rr-users-alt"></i></span>소식</button>
      <button class="nav-item" data-route="my"><span><i class="fi fi-rr-user"></i></span>마이</button>
    </nav>
  </div>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-panel">
      <div class="drawer-head">
        <div><small>우리 집</small><h2>아파트온</h2><p>101동 1302호 · 김하늘</p></div>
        <button class="round icon" id="closeDrawer">×</button>
      </div>
      <div id="drawerMenu"></div>
    </div>
  </aside>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-card">
      <button class="modal-close" id="modalClose">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="js/app.js"></script>
</body>
</html>
